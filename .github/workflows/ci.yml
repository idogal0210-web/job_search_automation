name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test Suite & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests/ -v

      - name: Verify Dashboard Build
        run: |
          python -c "
          import json
          from src.ui_builder import build_and_save_docs_app
          with open('data/weekly_archive.json', 'r', encoding='utf-8') as f:
              jobs = json.load(f)
          build_and_save_docs_app(jobs[:5], [], '.', is_weekly=False)
          print('CI build test passed successfully')
          "
