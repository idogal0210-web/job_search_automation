name: Daily & Weekly Job Search Automation

on:
  schedule:
    # Daily job search at 06:35 AM Israel Time (03:35 AM UTC)
    - cron: '35 3 * * *'
    # Saturday weekly summary at 11:55 AM Israel Time (08:55 AM UTC)
    - cron: '55 8 * * 6'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  job-search-daily:
    runs-on: ubuntu-latest
    name: "Daily Job Search - Ido Gal"
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '35 3 * * *'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Job Search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          python job_search.py

      - name: Commit and push updated history & weekly archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json weekly_archive.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_jobs and weekly_archive [skip ci]" && git push)

  weekly-summary-saturday:
    runs-on: ubuntu-latest
    name: "Saturday Weekly Digest - Ido Gal"
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '55 8 * * 6'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch Saturday Weekly Summary Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: |
          python weekly_summary.py
