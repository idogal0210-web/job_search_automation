name: Daily Job Search Automation

on:
  schedule:
    - cron: '28 7 * * *'    # 10:28 שעון ישראל (07:28 UTC) — חיפוש יומי
  workflow_dispatch:

permissions:
  contents: write

jobs:
  job-search-daily:
    runs-on: ubuntu-latest
    name: "Daily Job Search - Ido Gal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Energy & Drone Job Searches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          python daily_job_search_unified.py

      - name: Commit and push updated history, weekly archive, and interactive docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/ seen_jobs.json seen_drones.json weekly_archive.json rejected_jobs.json docs/ || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update history, archive and interactive docs [skip ci]" && git push)

      - name: Send Urgent Failure Alert Email (Exceptions Only)
        if: failure()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header

          sender = os.environ.get('SENDER_EMAIL')
          pwd = os.environ.get('SENDER_APP_PASSWORD')
          run_url = os.environ.get('RUN_URL')
          recipient = 'idogal0210@gmail.com'

          if sender and pwd:
              msg = MIMEMultipart()
              msg['Subject'] = Header('⚠️ התראת תקלה: ריצת חיפוש המשרות נכשלה | עידו גל', 'utf-8')
              msg['From'] = Header(f'Job Search Alert <{sender}>', 'utf-8')
              msg['To'] = Header(recipient, 'utf-8')
              body = f'<div dir=\"rtl\" style=\"font-family: Arial; padding: 20px;\"><h2 style=\"color: #dc2626;\">⚠️ התרחשה שגיאה בריצת חיפוש המשרות</h2><p>ריצת האוטומציה נתקלה בשגיאה באחד השלבים.</p><p><a href=\"{run_url}\" style=\"background: #dc2626; color: white; padding: 10px 16px; text-decoration: none; border-radius: 6px; display: inline-block;\">צפה ביומן הריצה ב-GitHub Actions ↗</a></p></div>'
              msg.attach(MIMEText(body, 'html', 'utf-8'))
              server = smtplib.SMTP('smtp.gmail.com', 587, timeout=20)
              server.starttls()
              server.login(sender, pwd)
              server.sendmail(sender, recipient, msg.as_string())
              server.quit()
              print('[+] Failure alert email dispatched.')
          "
