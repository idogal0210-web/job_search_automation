name: Daily & Weekly Job Search Automation

on:
  schedule:
    # Daily job search at 07:30 AM Israel Time (04:30 AM UTC)
    - cron: '30 4 * * *'
    # Saturday weekly summary at 11:55 AM Israel Time (08:55 AM UTC)
    - cron: '55 8 * * 6'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Automation job to run'
        required: true
        default: 'both'
        type: choice
        options:
          - daily
          - weekly
          - both

permissions:
  contents: write

jobs:
  job-search-daily:
    runs-on: ubuntu-latest
    name: "Daily Job Search - Ido Gal"
    if: |
      (github.event_name == 'schedule' && github.event.schedule == '30 4 * * *') ||
      (github.event_name == 'workflow_dispatch' && (inputs.job_type == 'daily' || inputs.job_type == 'both'))

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Energy & Drone Job Searches
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          python job_search.py
          python drone_job_search.py

      - name: Commit and push updated history & weekly archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add seen_jobs.json seen_drones.json weekly_archive.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_jobs, seen_drones and weekly_archive [skip ci]" && git push)

  weekly-summary-saturday:
    runs-on: ubuntu-latest
    name: "Saturday Weekly Digest - Ido Gal"
    needs: [job-search-daily]
    if: |
      always() && (
        (github.event_name == 'schedule' && github.event.schedule == '55 8 * * 6') ||
        (github.event_name == 'workflow_dispatch' && (inputs.job_type == 'weekly' || inputs.job_type == 'both'))
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dispatch Saturday Weekly Summary Email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
        run: |
          python weekly_summary.py
