name: Daily Job Search Automation

on:
  schedule:
    - cron: '17 4 * * 0-5'    # 07:17 שעון ישראל (04:17 UTC) — ימים ראשון עד שישי (ללא שבת)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-job-search"
  cancel-in-progress: false

jobs:
  job-search-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: "Daily Job Search - Ido Gal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (Quality & Reliability Gate)
        run: |
          python -m unittest discover tests/ -v

      - name: Run Daily Energy & Drone Job Searches
        id: search
        continue-on-error: true
        timeout-minutes: 40
        env:
          PYTHONUNBUFFERED: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PREFER_GROQ: ${{ vars.PREFER_GROQ }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
        run: |
          python -u main.py

      - name: Persist checkpoints even when search fails
        if: ${{ always() && (steps.search.outcome == 'success' || steps.search.outcome == 'failure') }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          for path in data/jobs_state.json data/evaluation_state.json data/weekly_archive.json data/historical_catalog.json docs/index.html; do
            if test -f "$path"; then git add -- "$path"; fi
          done
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: save job evaluations and dashboard [skip ci]"
            
            pushed=false
            for attempt in 1 2 3; do
              echo "Push attempt $attempt..."
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=true
                echo "Successfully pushed to origin/main on attempt $attempt"
                break
              fi
              echo "Push attempt $attempt failed. Waiting before retry..."
              sleep $(( attempt * 5 ))
            done

            if [ "$pushed" = false ]; then
              echo "Error: Failed to push to origin/main after 3 attempts"
              exit 1
            fi
          else
            echo "No changes to commit or push."
          fi

      - name: Verify Search Outcome
        id: report
        if: ${{ always() && (steps.search.outcome == 'success' || steps.search.outcome == 'failure') }}
        env:
          SEARCH_OUTCOME: ${{ steps.search.outcome }}
        run: |
          if test "$SEARCH_OUTCOME" != 'success'; then
            echo 'Search failed; checkpoints were attempted above. Inspect the state commit step.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Send Urgent Failure Alert Email (Exceptions Only)
        if: failure() || cancelled()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 -c "
          import os, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          from email.header import Header

          sender = os.environ.get('SENDER_EMAIL')
          pwd = os.environ.get('SENDER_APP_PASSWORD')
          run_url = os.environ.get('RUN_URL')
          recipient = 'idogal0210@gmail.com'

          if sender and pwd:
              msg = MIMEMultipart()
              msg['Subject'] = Header('⚠️ התראת תקלה: ריצת חיפוש המשרות נכשלה | עידו גל', 'utf-8')
              msg['From'] = Header(f'Job Search Alert <{sender}>', 'utf-8')
              msg['To'] = Header(recipient, 'utf-8')
              body = f'<div dir=\"rtl\" style=\"font-family: Arial; padding: 20px;\"><h2 style=\"color: #dc2626;\">⚠️ התרחשה שגיאה בריצת חיפוש המשרות</h2><p>ריצת האוטומציה נתקלה בשגיאה באחד השלבים.</p><p><a href=\"{run_url}\" style=\"background: #dc2626; color: white; padding: 10px 16px; text-decoration: none; border-radius: 6px; display: inline-block;\">צפה ביומן הריצה ב-GitHub Actions ↗</a></p></div>'
              msg.attach(MIMEText(body, 'html', 'utf-8'))
              server = smtplib.SMTP('smtp.gmail.com', 587, timeout=20)
              server.starttls()
              server.login(sender, pwd)
              server.sendmail(sender, recipient, msg.as_string())
              server.quit()
              print('[+] Failure alert email dispatched.')
          "
