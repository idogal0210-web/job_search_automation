name: Daily Job Search Automation

on:
  schedule:
    # Runs daily around 07:00 AM Israel Time (03:35 AM UTC to avoid GitHub queue delays)
    - cron: '35 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  job-search-ido:
    runs-on: ubuntu-latest
    name: "Job Search - Ido Gal"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Job Search for Ido Gal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
          GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
        run: |
          python job_search.py

      - name: Commit and push 14-day seen jobs history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update seen_jobs 14-day history [skip ci]" && git push)
