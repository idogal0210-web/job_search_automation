<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none" dir="ltr">
  <defs>
    <linearGradient id="aj_icon_hex_grad" x1="24" y1="20" x2="76" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="aj_icon_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.55"/>
    </filter>
  </defs>
  <!-- Outer dashed radar ring -->
  <circle cx="50" cy="50" r="42" stroke="#0284C7" stroke-width="2" stroke-dasharray="5 4" opacity="0.45" />
  <!-- Dynamic sweep arc -->
  <path d="M 50 8 A 42 42 0 0 1 92 50" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" filter="url(#aj_icon_glow)" />
  <!-- Precision Hexagonal Core -->
  <polygon points="50,18 76,33 76,67 50,82 24,67 24,33" fill="url(#aj_icon_hex_grad)" stroke="#38BDF8" stroke-width="2.5" />
  <!-- Crosshair Target Ticks -->
  <line x1="50" y1="22" x2="50" y2="34" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="50" y1="66" x2="50" y2="78" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="22" y1="50" x2="34" y2="50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="66" y1="50" x2="78" y2="50" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glowing Emerald Node -->
  <circle cx="50" cy="50" r="7" fill="#10B981" />
  <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
</svg>
